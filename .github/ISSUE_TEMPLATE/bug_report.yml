name: Bug report
description: Report a reproducible problem using synthetic or de-identified examples.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report current SegAgent Research v3 behavior on main. Its source directory
        retains the historical name segagent-research-v2. Search existing issues
        first. Do not attach patient images, PHI, credentials, or identifying logs.
        Report security vulnerabilities privately as described
        in [SECURITY.md](https://github.com/Syndr0/SegAgent/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Planning or dialogue
        - Segmentation or image handling
        - Evidence or contour QC
        - Retrieval or protocols
        - Frontend or viewer
        - Storage or interoperability
        - Documentation or repository files
        - Unsure
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: Include the commit SHA or version you tested and any local changes.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps and synthetic input where possible.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Python, Node.js, browser, GPU/CUDA, and dependency versions. Omit secrets and private paths.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Remove identifying information and credentials before posting.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include workarounds, related issues, and model revisions if relevant.
