<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1432" viewBox="0 0 1800 1432" role="img" aria-labelledby="title description">
<title id="title">SegAgent Research v2 architecture</title>
<desc id="description">A React interface sends case questions and review decisions to FastAPI. A checkpointed LangGraph workflow uses the Qwen2.5-VL planner to select protocol lookup, text-prompted VoxTell segmentation with human mask review, or contour quality control. Protocol lookup uses seed protocols and optional guideline text. Typed tool observations return to the planner. An evidence critic checks the final answer. Local knowledge, the independent VoxTell expert, file-backed artifacts, JSONL events and SQLite checkpoints support the workflow. MCP exposes tools directly; the A2A research adapter uses the workflow. Results stream to the interface as NDJSON.</desc>
